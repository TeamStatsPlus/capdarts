name: Update league data

on:
  schedule:
    - cron: "17 * * * *"       # every hour, at 17 minutes past
  workflow_dispatch:           # "Run workflow" button
  push:
    branches: [main]

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Fetch and parse reports
        id: upd
        continue-on-error: true
        run: python scripts/update.py
      - name: Save data files if they changed
        run: |
          git config user.name "league-bot"
          git config user.email "league-bot@users.noreply.github.com"
          git add catalog.json players.json data
          git diff --cached --quiet || (git commit -m "Update league data" && git push)
      - name: Build site folder
        run: mkdir site && cp -r index.html catalog.json players.json data manifest.webmanifest sw.js icon-192.png icon-512.png apple-touch-icon.png site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Report update problems
        if: steps.upd.outcome == 'failure'
        run: |
          echo "One or more reports could not be read. The site is still live with the last good data."
          exit 1
