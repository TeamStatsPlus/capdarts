</style></head><body><div class="wrap">
<header><div><h1 id="h1">Cap Darts Stats</h1><div class="sub" id="s1"></div><div class="sub" id="s2"></div></div>
<button class="theme" id="theme">Change to dark theme</button></header>

<footer class="foot"><button class="theme" id="a2hs">Add to Home Screen</button></footer></div>

<script>
const cols={c:[["Player",0,1],["Team",1,1],["MPR",2],["Games",3],["Wins",4],["Win%",-1],["Assist",5],["Hat",6],["Whrse",7],["5MR",8],["6MR",9],["7MR",10],["8MR",11],["9MR",12]],
x:[["Player",0,1],["Team",1,1],["PPD",2],["Games",3],["Wins",4],["Win%",-1],["Hats",5],["3BD",6],["Ton80",7],["HTon",8],["LTon",9]]};
let standings,standings_,T,cr,xr,results,improved,TM,WK,SITES,D;const S={c:"MPR",x:"PPD"};

const medals=["🥇","🥈","🥉"],mine=t=>t&&t==myTeam?"mine":"";
const todayS=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};

const cd=d=>{const n=Math.round((new Date(d+"T00:00:00")-new Date(todayS()+"T00:00:00"))/864e5);return n<=0?"Today":n==1?"Tomorrow":"In "+n+" days"};

const addr=n=>((SITES||[]).find(x=>x[0]==n)||[])[3]||n;
const main=document.getElementById("main"),dlg=document.getElementById("dlg");

tb.onclick=()=>{document.documentElement.dataset.theme=isDark()?"light":"dark";setLbl()};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",setLbl);setLbl();

function standingsV(){
 return `<h2 id="sec-standings" style="margin-top:0">Team standings</h2><div class="sub" style="margin:-6px 0 10px">Sorted by win %</div>`+tbl(["Team","Win %","Games","Wins","Losses","Forfeits"].map(h=>`<th>${h}</th>`).join(""),
 standings.map((s,i)=>`<tr class="${mine(s[0])}" style="cursor:default"><td>${i<3?medals[i]+" ":""}${dot(s[0])}${s[0]}</td><td><b>${f(s[1]/(s[1]+s[2])*100,1)}</b></td><td>${s[1]+s[2]}</td><td>${s[1]}</td><td>${s[2]}</td><td>0</td></tr>`).join(""))}

 return `<h2 id="sec-results">Last match results</h2>`+tbl(["Team","Against","Date","Week","Games","Wins","Losses","Forfeits"].map((h,i)=>`<th class="${i<2?"l":""}">${h}</th>`).join(""),
 results.map(r=>`<tr class="${mine(r[0])}" style="cursor:default"><td>${dot(r[0])}${r[0]}</td><td class="l">${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>15</td><td class="${r[4]>r[5]?"win":"loss"}">${r[4]}</td><td>${r[5]}</td><td>0</td></tr>`).join(""))}

 if(!improved[m].length){if(m=="x"||improved.x.length)return "";return `<h2 id="sec-imp-c">Most improved players</h2><div class="card sub">Most improved players will show up here starting with the second week of results, once there is a previous week to compare against.</div>`}
 const l=m=="c"?["MPR","Cricket"]:["PPD","X01"];
 return `<h2 id="sec-imp-${m}">Most improved players${curWk?", week "+curWk:""}: all ${l[1]} games</h2>`+tbl(["Player","Team","Previous "+l[0],l[0],l[0]+" improvement"].map((h,i)=>`<th class="${i<2?"l":""}">${h}</th>`).join(""),
 improved[m].map(r=>`<tr data-p="${r[0]}" class="${mine(r[1])}"><td>${r[0]}</td><td class="l">${dot(r[1])}${r[1]}</td><td>${f(r[2],2)}</td><td>${f(r[3],2)}</td><td class="win">+${f(r[3]-r[2],2)}</td></tr>`).join(""))}
function playersV(m){
 const cs=cols[m],st=sorts[m],val=(r,c)=>c[1]===-1?pw(0,r):r[c[1]];

 data.sort((a,b)=>{const x=val(a,sc),y=val(b,sc);return (typeof x=="string"?x.localeCompare(y):x-y)*st.d});
 return `<h2 id="sec-${m}">All ${m=="c"?"Cricket":"X01"} games, sorted by ${S[m]}</h2>`+tbl(cs.map((c,i)=>`<th data-t="${m}" data-s="${i}" class="${i==st.c?"s":""}" data-d="${st.d<0?" ▼":" ▲"}">${c[0]}</th>`).join(""),
 data.map(r=>`<tr data-p="${r[0]}" class="${mine(r[1])}">${cs.map((c,i)=>{const v=val(r,c);return `<td>${i==1?dot(v)+v:c[1]===-1?f(v,1)+"%":c[1]===2?`<b>${f(v,2)}</b>`:v}</td>`}).join("")}</tr>`).join("")||`<tr><td colspan="14">No players match. Clear the search or team filter.</td></tr>`)}
function compareV(){
 const sel=(id,v)=>`<select id="${id}">${names.map(n=>`<option ${n==v?"selected":""}>${n}</option>`).join("")}</select>`;
 const a=window.A||"Carlton Smith",b=window.B||"Rich Allen",g=(n,m)=>D[m].find(r=>r[0]==n);
 const L=[["MPR",r=>g(r,"c")[2],2],["PPD",r=>g(r,"x")[2],2],["Cricket win %",r=>pw(0,g(r,"c")),1],["X01 win %",r=>pw(0,g(r,"x")),1],["Cricket hats",r=>g(r,"c")[6],0],["X01 hats",r=>g(r,"x")[5],0],["9-mark rounds",r=>g(r,"c")[12],0],["High tons",r=>g(r,"x")[8],0],["Assists",r=>g(r,"c")[5],0]];
 return `<h2>Compare players</h2><div class="tools">${sel("pa",a)}<span style="align-self:center">vs</span>${sel("pb",b)}</div><div class="card cmp"><b>${a}</b><span></span><b>${b}</b>${L.map(([k,fn,d])=>{const x=fn(a),y=fn(b),m=Math.max(x,y)||1;return `<div class="v">${f(x,d)}</div><small>${k}</small><div class="v">${f(y,d)}</div><div class="a"><i style="width:${x/m*100}%"></i></div><span></span><div class="b"><i style="width:${y/m*100}%"></i></div>`}).join("")}</div>`}
function filterV(){return `<div class="tools" style="margin-top:28px"><input id="q" placeholder="Search players" value="${q}"><select id="tf"><option value="">All teams</option>${Object.keys(T).map(t=>`<option ${t==team?"selected":""}>${t}</option>`).join("")}</select><span class="sub" style="align-self:center">Filters the player tables below. Click a player for their profile.</span></div>`}
const tabs=["My Team","Stats","Schedule","Locations","Captains","All Players"];let tab=1,stTeam="",showPast=false,cq="";
function loadState(){team=ls.get("dt_tf")||"";stTeam=ls.get("dt_st")||"";showPast=ls.get("dt_sp")=="1";const t=parseInt(ls.get("dt_tab"));tab=t>=0&&t<=5?t:1}
function saveState(){ls.set("dt_tab",tab);if(divId)ls.set("dt_my_"+divId,myTeam);ls.set("dt_tf",team);ls.set("dt_st",stTeam);ls.set("dt_sp",showPast?1:0)}
let cat=null,byId={},cur=null,curData=null,divId="",pins=[],selOpen=false;
const nav=document.getElementById("nav");
nav.innerHTML=tabs.map((t,i)=>`<button data-i="${i}">${t}</button>`).join("");

 <div class="rowl"><label>Division</label><div class="chips">${dy.divisions.map(v=>`<button class="sp ${v.id==cur.id?"on":""}" data-div="${v.id}">${v.name}</button>`).join("")}</div></div></div>`}
function renderSel(){const e=document.getElementById("sel");e.className="sel"+(selOpen?" open":"");e.innerHTML=selV()}
function openDiv(id){
 const b=byId[id];if(!b)return Promise.resolve();
 cur=b;divId=id;curData=null;myTeam=ls.get("dt_my_"+id)||"";team="";stTeam="";cq="";q="";
 ls.set("dt_sel",id);try{history.replaceState(null,"","#"+id)}catch(e){}
 setHead();renderSel();main.innerHTML='<div class="card">Loading…</div>';
 return fetch("data/"+id+".json",{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{if(divId!=id)return;init(d);render()}).catch(()=>{if(divId==id)main.innerHTML='<div class="card">This division’s data isn’t available yet. Try again in a few minutes.</div>'})}
const selEl=document.getElementById("sel");
selEl.onclick=e=>{const b=e.target.closest("button");if(!b)return;const k=b.dataset;
 if(k.sum)return(selOpen=!selOpen,renderSel());
 if(k.day){const dy=cat.seasons.find(x=>x.name==cur.season).days.find(x=>x.name==k.day);return openDiv(dy.divisions[0].id)}
 if(k.div||k.go){selOpen=false;return openDiv(k.div||k.go)}
 if(k.rm){pins=pins.filter(x=>x!=k.rm);ls.set("dt_pins",JSON.stringify(pins));return renderSel()}
 if(k.pin){if(!pins.includes(cur.id)){pins=[...pins,cur.id];ls.set("dt_pins",JSON.stringify(pins))}renderSel()}};
selEl.onchange=e=>{if(e.target.id!="ss")return;const se=cat.seasons.find(x=>x.name==e.target.value),dy=se.days.find(x=>x.name==cur.day)||se.days[0];openDiv((dy.divisions.find(x=>x.name==cur.name)||dy.divisions[0]).id)};
loadState();
fetch("catalog.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(c=>{
 cat=c;byId={};for(const s of c.seasons)for(const d of s.days)for(const v of d.divisions)byId[v.id]={id:v.id,name:v.name,day:d.name,season:s.name};
 try{pins=JSON.parse(ls.get("dt_pins")||"null")||[]}catch(e){pins=[]}pins=pins.filter(id=>byId[id]);
 const h=(location.hash||"").slice(1),sv=ls.get("dt_sel"),id=byId[h]?h:byId[sv]?sv:byId[c.default]?c.default:Object.keys(byId)[0];
 if(!id)throw 0;return openDiv(id)}).catch(()=>{main.innerHTML='<div class="card">Could not load the league list. Refresh the page, or try again later.</div>'});
setInterval(()=>{if(document.hidden||!divId)return;const id=divId;fetch("data/"+id+".json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(d=>{if(d&&id==divId&&d.updated!==lastUpd){init(d);render()}}).catch(()=>{})},600000);

function help(){let h;
 if(inApp)h=`<p>This page is open inside another app, which can't add it to your Home Screen. Open it in ${iOS?"Safari":"Chrome"} first.</p><button class="theme" id="cp">Copy link</button>`;
 else if(iOS)h=`<ol class="st"><li>Tap the Share button ${IC.share} in Safari's toolbar or menu.</li><li>Scroll down and tap <b>Add to Home Screen</b> ${IC.add}.</li><li>Tap <b>Add</b>.</li></ol>`;
 else h=`<p>Open your browser menu (⋮) and choose <b>Install app</b> or <b>Add to Home screen</b>. On a computer, look for the install icon in the address bar.</p>`;
 document.getElementById("dlb").innerHTML=`<h3>Add to Home Screen</h3>${h}<div style="margin-top:14px"><button class="theme" onclick="dlg.close()">Close</button></div>`;dlg.showModal();
 const cp=document.getElementById("cp");if(cp)cp.onclick=()=>{(navigator.clipboard?navigator.clipboard.writeText(location.href):Promise.reject()).then(()=>cp.textContent="Link copied").catch(()=>cp.textContent="Copy failed")}}
async function doInstall(){if(dip){dip.prompt();try{await dip.userChoice}catch(e){}dip=null;a2.textContent="Add to Home Screen";ib.hidden=true;return}help()}
function showBanner(){if(isApp()||ls.get("dt_ib")=="1")return;
 ib.innerHTML=dip?`<b>Install Dart Stats</b><p>Add it to your Home Screen to open it like an app.</p><div class="ibb"><button class="theme" data-a="inst">Install</button><button class="theme" data-a="no">Not now</button></div>`:`<b>Add Dart Stats to your Home Screen</b><p>Tap Share ${IC.share}, then <b>Add to Home Screen</b> ${IC.add}.</p><div class="ibb"><button class="theme" data-a="how">Show me how</button><button class="theme" data-a="no">Not now</button></div>`;ib.hidden=false}
ib.onclick=e=>{const a=e.target.closest("[data-a]");if(!a)return;const k=a.dataset.a;if(k=="no"){ls.set("dt_ib","1");ib.hidden=true}else if(k=="inst")doInstall();else help()};
a2.onclick=doInstall;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();dip=e;a2.textContent="Install app";if(matchMedia("(pointer: coarse)").matches)showBanner()});
addEventListener("appinstalled",()=>{dip=null;hideAll()});
if(iOS&&!inApp&&!isApp())setTimeout(showBanner,2500);
